[project]
name = "churn-mlops"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mlflow==2.22.2", "sqlalchemy==2.0.41", "evidently==0.7.23", "pandas==2.2.3", "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1", "pydantic==2.11.4", "python-dotenv==1.1.0", "pyyaml==6.0.2", "scikit-learn==1.6.1", "matplotlib==3.10.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_mlops"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
